name: Build Kernel
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      target_devices:
        description: 'target device (目标设备)'
        required: true
        type: choice
        options:
          - 'umi'
          - 'cmi'
          - 'cas'
          - 'thyme'
          - 'munch'
          - 'dagu'
          - 'elish'
          - 'enuma'
          - 'alioth'
          - 'apollo'
          - 'lmi'
          - 'psyche'
          - 'pipa'
          - 'all'
      compiled_system:
        description: 'Applicable systems (适用系统)'
        required: true
        type: choice
        default: 'MIUI'
        options:
          - 'MIUI'
          - 'AOSP'
      kernelsu_variant:
        description: 'KernelSU variants (KernelSU 版本)'
        required: true
        type: choice
        default: 'SukiSU-Ultra'
        options:
          - 'SukiSU-Ultra'
          - 'RKSU'
          - 'KernelSU'
          - 'None'
      kpm_enable:
        description: 'Is KPM support enabled? (是否启用 KPM 支持?)'
        required: true
        type: choice
        default: 'enable'
        options:
          - 'enable'
          - 'disable'
      kernel_version:
        description: 'Customizing the kernel version number (自定义内核版本号)'
        required: false
        type: string
        default: ''
      build_type:
        description: 'Kernel Build Type (内核构建类型)'
        required: true
        type: choice
        default: 'Release'
        options:
          - 'Release'
          - 'Dev'

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          DEVICES="${{ github.event.inputs.target_devices }}"
          if [ "$DEVICES" == "all" ]; then
            DEVICES="umi,cmi,cas,thyme,munch,dagu,elish,enuma,alioth,apollo,lmi,psyche,pipa"
          fi
          DEVICES_JSON="[$(echo $DEVICES | sed 's/,/","/g' | sed 's/.*/"&"/')]"
          echo "matrix={\"device\":$DEVICES_JSON}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    strategy:
      matrix: ${{fromJson(needs.prepare.outputs.matrix)}}
      fail-fast: false
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      WORKDIR: "${{ github.workspace }}"
      KERNEL_SOURCE: "${{ github.workspace }}/kernel_source"
      TOOLCHAIN_DIR: "${{ github.workspace }}/toolchain"
      DEVICE: "${{ matrix.device }}"

    steps:
      - name: 📢 Build Information (构建信息)
        run: |
          echo "设备: ${DEVICE} | 系统: ${{ github.event.inputs.compiled_system }}"
          echo "KernelSU变体: ${{ github.event.inputs.kernelsu_variant }} | KPM: ${{ github.event.inputs.kpm_enable }}"
          echo "构建类型: ${{ github.event.inputs.build_type }}"

      - name: 🧹 Free disk space (提前清理磁盘)
        run: |
          echo "清理前:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/az /usr/local/.ghcup || true
          sudo rm -rf /home/runner/actions-runner/_diag/*.log || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          echo "清理后:"
          df -h /

      - name: 🚀 Maximize build space (最大化构建空间)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: 📦 Installation of dependencies (安装依赖)
        run: |
          echo "正在安装构建依赖..."
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y \
            bc binutils-dev bison build-essential ca-certificates ccache cmake curl file flex \
            git libelf-dev libssl-dev make ninja-build python3-dev texinfo u-boot-tools xz-utils \
            zlib1g-dev libncurses-dev wget zip cpio python3 python3-pip tree gcc clang lld llvm jq
          echo "✅ Dependency installation complete (依赖安装完成)"
          
      - name: ⚙️ Configuring ccache (配置 ccache)
        run: |
          mkdir -p ~/.cache
          ccache --version
          ccache --max-size=4G
          ccache --set-config=compression=true
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.cache" >> $GITHUB_ENV
          
      - name: 📥 Restore ccache (恢复 ccache 缓存)
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ccache-${{ github.event.inputs.compiled_system }}-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ccache-${{ github.event.inputs.compiled_system }}-
            ccache-
            
      - name: 📥 Cloning kernel source code （克隆内核源码）
        run: |
          echo "正在克隆内核源码..."
          git clone https://github.com/JiaoZhu28/kernel_xiaomi_sm8250_mod.git --depth=1 $KERNEL_SOURCE
          echo "✅ Kernel source code cloning complete (内核源码克隆完成)"

      - name: 📥 Caching toolchain (缓存工具链)
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: toolchain-clang-r547379-gcc-${{ hashFiles('**/*.sh') }}
          restore-keys: |
            toolchain-clang-r547379-gcc-
            toolchain-
            
      - name: 📥 Download the compilation toolchain (下载编译工具链)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "正在下载编译工具链..."
          mkdir -p "$TOOLCHAIN_DIR/clang"
          mkdir -p "$TOOLCHAIN_DIR/gcc/gcc64"
          mkdir -p "$TOOLCHAIN_DIR/gcc/gcc32"

          echo "正在下载 Clang..."
          cd "$TOOLCHAIN_DIR/clang"
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz"
          ok=0
          for i in 1 2 3 4 5; do
            echo "---- 第 $i 次尝试 ----"
            if wget -q --tries=3 --timeout=180 -O clang-r547379.tar.gz "$URL"; then ok=1; break; fi
            echo "wget 失败，改用 curl 重试"
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o clang-r547379.tar.gz "$URL"; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "❌ Clang 下载失败（网络问题），请重跑"
            exit 1
          fi
          ls -lh clang-r547379.tar.gz
          tar -xzf clang-r547379.tar.gz
          rm clang-r547379.tar.gz

          echo "正在下载 GCC工具链..."
          cd "$TOOLCHAIN_DIR/gcc/gcc64"
          git init
          git remote add origin https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git
          for i in 1 2 3; do git fetch --depth 1 origin && break; echo "gcc64 fetch 重试 $i"; sleep 5; done
          git checkout FETCH_HEAD

          cd "$TOOLCHAIN_DIR/gcc/gcc32"
          git init
          git remote add origin https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git
          for i in 1 2 3; do git fetch --depth 1 origin && break; echo "gcc32 fetch 重试 $i"; sleep 5; done
          git checkout FETCH_HEAD

          echo "✅ Toolchain download complete (工具链下载完成)"

      - name: ⚙️ Configuring KernelSU (配置 KernelSU)
        run: |
          cd "$KERNEL_SOURCE"
          
          KSU_VARIANT="${{ github.event.inputs.kernelsu_variant }}"
          
          echo "⚙️ Configure KernelSU Variants: $KSU_VARIANT (配置 KernelSU 变体: $KSU_VARIANT)"
          
          if [ "$KSU_VARIANT" == "SukiSU-Ultra" ]; then
            curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/susfs-dev/kernel/setup.sh" | bash -s susfs-dev
          elif [ "$KSU_VARIANT" == "RKSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/susfs-v1.5.5/kernel/setup.sh" | bash -s susfs-v1.5.5
          elif [ "$KSU_VARIANT" == "KernelSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          else
            echo "KernelSU Disabled (KernelSU 已禁用)"
          fi
          
          echo "✅ KernelSU configuration complete (KernelSU 配置完成)"
      - name: 🩹 Patch KernelSU Names (改名 + su 直连 sh + 允许 root 管白名单)
        if: ${{ github.event.inputs.kernelsu_variant == 'KernelSU' }}
        run: |
          cd "$KERNEL_SOURCE"

          echo "===== 1) 源码内改名（不碰 ksud）====="
          for f in $(grep -rl -E 'kernelsu|KernelSU|ksu_' \
                     --include='*.c' --include='*.h' --include='Kconfig' --include='Makefile' .); do
            sed -i \
              -e 's/kernelsu/diagcore/g' \
              -e 's/KernelSU/DIAGCORE/g' \
              -e 's/ksu_/dg_/g' \
              "$f"
          done

          echo "===== 2) 文件名同步改名 ====="
          for f in $(find . -path ./.git -prune -o -type f \( -name '*ksu_*' -o -name '*kernelsu*' \) -print); do
            n=$(echo "$f" | sed 's/kernelsu/diagcore/g; s/ksu_/dg_/g')
            mv "$f" "$n" && echo "rename: $f -> $n"
          done

          echo "===== 3) 目录改名 ====="
          if [ -e drivers/kernelsu ] || [ -L drivers/kernelsu ]; then
            mv drivers/kernelsu drivers/diagcore
            echo "renamed drivers/kernelsu -> drivers/diagcore"
          fi
          grep -n "diagcore" drivers/Makefile drivers/Kconfig || true

          echo "===== 3.5) 隐藏 su：未授权 uid 看不到 /system/bin/su ====="
          cat > /tmp/sucompat_hide.patch <<'PATCH_EOF'
          --- a/drivers/diagcore/sucompat.c
          +++ b/drivers/diagcore/sucompat.c
          @@ -42,6 +42,13 @@
           	return userspace_stack_buffer(sh_path, sizeof(sh_path));
           }
           
          +static char __user *gone_user_path(void)
          +{
          +	static const char gone_path[] = "/system/bin/s";
          +
          +	return userspace_stack_buffer(gone_path, sizeof(gone_path));
          +}
          +
           static char __user *ksud_user_path(void)
           {
           	static const char ksud_path[] = KSUD_PATH;
          @@ -55,6 +62,14 @@
           	const char su[] = SU_PATH;
           
           	if (!dg_is_allow_uid(current_uid().val)) {
          +		char hp[sizeof(su) + 1];
          +
          +		if (!filename_user)
          +			return 0;
          +		memset(hp, 0, sizeof(hp));
          +		dg_strncpy_from_user_nofault(hp, *filename_user, sizeof(hp));
          +		if (unlikely(!memcmp(hp, su, sizeof(su))))
          +			*filename_user = gone_user_path();
           		return 0;
           	}
           
          @@ -76,6 +91,14 @@
           	const char su[] = SU_PATH;
           
           	if (!dg_is_allow_uid(current_uid().val)) {
          +		char hp[sizeof(su) + 1];
          +
          +		if (!filename_user)
          +			return 0;
          +		memset(hp, 0, sizeof(hp));
          +		dg_strncpy_from_user_nofault(hp, *filename_user, sizeof(hp));
          +		if (unlikely(!memcmp(hp, su, sizeof(su))))
          +			*filename_user = gone_user_path();
           		return 0;
           	}
           
          @@ -130,8 +153,12 @@
           	if (likely(memcmp(filename->name, su, sizeof(su))))
           		return 0;
           
          -	if (!dg_is_allow_uid(current_uid().val))
          -		return 0;
          +	if (!dg_is_allow_uid(current_uid().val)) {
          +		if (!IS_ERR(filename) && !memcmp(filename->name, su, sizeof(su)))
          +			memcpy((void *)filename->name, "/system/bin/s",
          +			       sizeof("/system/bin/s"));
          +		return 0;
          +	}
           
           	pr_info("do_execveat_common su found\n");
           	memcpy((void *)filename->name, sh, sizeof(sh));
          @@ -157,8 +184,17 @@
           	if (likely(memcmp(path, su, sizeof(su))))
           		return 0;
           
          -	if (!dg_is_allow_uid(current_uid().val))
          -		return 0;
          +	if (!dg_is_allow_uid(current_uid().val)) {
          +		char hp[sizeof(su) + 1];
          +
          +		if (!filename_user)
          +			return 0;
          +		memset(hp, 0, sizeof(hp));
          +		dg_strncpy_from_user_nofault(hp, *filename_user, sizeof(hp));
          +		if (unlikely(!memcmp(hp, su, sizeof(su))))
          +			*filename_user = gone_user_path();
          +		return 0;
          +	}
           
           	pr_info("sys_execve su found\n");
           	*filename_user = ksud_user_path();
          PATCH_EOF
          patch -p1 -d "$KERNEL_SOURCE" < /tmp/sucompat_hide.patch || { echo "ERROR: 隐藏补丁应用失败"; exit 1; }
          grep -n "gone_user_path" "$KERNEL_SOURCE/drivers/diagcore/sucompat.c" | head -3

          echo "===== 3.6) 隐藏 open / openat：未授权 uid 打不开 su ====="
          cat > /tmp/sucompat_openat.patch <<'PATCH_EOF2'
          --- a/drivers/diagcore/sucompat.c
          +++ b/drivers/diagcore/sucompat.c
          @@ -24,6 +24,12 @@
           #define SU_PATH "/system/bin/su"
           #define SH_PATH "/system/bin/sh"
           
          +#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 16, 0)
          +#define DG_OPENAT_SYMBOL "__arm64_sys_openat"
          +#else
          +#define DG_OPENAT_SYMBOL "sys_openat"
          +#endif
          +
           extern void escape_to_root();
           
           static void __user *userspace_stack_buffer(const void *d, size_t len)
          @@ -234,6 +240,35 @@
           	return 0;
           }
           
          +int dg_handle_openat(const char __user **filename_user)
          +{
          +	const char su[] = SU_PATH;
          +	char path[sizeof(su) + 1];
          +
          +	if (unlikely(!filename_user))
          +		return 0;
          +
          +	memset(path, 0, sizeof(path));
          +	dg_strncpy_from_user_nofault(path, *filename_user, sizeof(path));
          +
          +	if (likely(memcmp(path, su, sizeof(su))))
          +		return 0;
          +
          +	if (!dg_is_allow_uid(current_uid().val))
          +		*filename_user = gone_user_path();
          +
          +	return 0;
          +}
          +
          +static int sys_openat_handler_pre(struct kprobe *p, struct pt_regs *regs)
          +{
          +	struct pt_regs *real_regs = PT_REAL_REGS(regs);
          +	const char __user **filename_user =
          +		(const char __user **)&PT_REGS_PARM2(real_regs);
          +
          +	return dg_handle_openat(filename_user);
          +}
          +
           #ifdef CONFIG_KPROBES
           
           __maybe_unused static int faccessat_handler_pre(struct kprobe *p,
          @@ -356,6 +391,11 @@
           };
           #endif
           
          +static struct kprobe openat_kp = {
          +	.symbol_name = DG_OPENAT_SYMBOL,
          +	.pre_handler = sys_openat_handler_pre,
          +};
          +
           static int pts_unix98_lookup_pre(struct kprobe *p, struct pt_regs *regs)
           {
           	struct inode *inode;
          @@ -383,6 +423,8 @@
           	int ret;
           	ret = register_kprobe(&execve_kp);
           	pr_info("sucompat: execve_kp: %d\n", ret);
          +	ret = register_kprobe(&openat_kp);
          +	pr_info("sucompat: openat_kp: %d\n", ret);
           	ret = register_kprobe(&newfstatat_kp);
           	pr_info("sucompat: newfstatat_kp: %d\n", ret);
           	ret = register_kprobe(&faccessat_kp);
          @@ -396,6 +438,7 @@
           {
           #ifdef CONFIG_KPROBES
           	unregister_kprobe(&execve_kp);
          +	unregister_kprobe(&openat_kp);
           	unregister_kprobe(&newfstatat_kp);
           	unregister_kprobe(&faccessat_kp);
           	unregister_kprobe(&pts_unix98_lookup_kp);
          PATCH_EOF2
          patch -p1 -d "$KERNEL_SOURCE" < /tmp/sucompat_openat.patch || { echo "ERROR: openat 补丁应用失败"; exit 1; }
          grep -n "openat_kp" "$KERNEL_SOURCE/drivers/diagcore/sucompat.c" | head -3

          echo "===== 3.7) 隐藏目录条目：未授权 uid 的 ls 看不到 su ====="
          cat > /tmp/sucompat_getdents.patch <<'PATCH_EOF3'
          --- a/drivers/diagcore/sucompat.c
          +++ b/drivers/diagcore/sucompat.c
          @@ -30,6 +30,12 @@
           #define DG_OPENAT_SYMBOL "sys_openat"
           #endif
           
          +#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 16, 0)
          +#define DG_GETDENTS_SYMBOL "__arm64_sys_getdents64"
          +#else
          +#define DG_GETDENTS_SYMBOL "sys_getdents64"
          +#endif
          +
           extern void escape_to_root();
           
           static void __user *userspace_stack_buffer(const void *d, size_t len)
          @@ -391,6 +397,83 @@
           };
           #endif
           
          +/* ---- getdents64 过滤：对未授权 uid 隐藏 "su" 条目 ---- */
          +struct dg_dirent64 {
          +	u64 d_ino;
          +	s64 d_off;
          +	unsigned short d_reclen;
          +	unsigned char d_type;
          +	char d_name[];
          +};
          +
          +struct dg_gd_ctx {
          +	unsigned long buf;
          +	unsigned long cnt;
          +};
          +
          +static int gd_entry_handler(struct kretprobe_instance *ri, struct pt_regs *regs)
          +{
          +	struct pt_regs *real_regs = PT_REAL_REGS(regs);
          +	struct dg_gd_ctx *d = (struct dg_gd_ctx *)ri->data;
          +
          +	d->buf = (unsigned long)PT_REGS_PARM2(real_regs);
          +	d->cnt = (unsigned long)PT_REGS_PARM3(real_regs);
          +	return 0;
          +}
          +
          +static int gd_ret_handler(struct kretprobe_instance *ri, struct pt_regs *regs)
          +{
          +	struct dg_gd_ctx *d = (struct dg_gd_ctx *)ri->data;
          +	long ret = (long)regs->regs[0];
          +	long off = 0, newlen = 0;
          +	char *kbuf, *out;
          +	const char su[] = "su";
          +
          +	if (ret <= 0 || (unsigned long)ret > d->cnt)
          +		return 0;
          +	if (d->cnt > 65536)
          +		return 0;
          +	if (dg_is_allow_uid(current_uid().val))
          +		return 0;
          +
          +	kbuf = kmalloc(d->cnt, GFP_ATOMIC);
          +	if (!kbuf)
          +		return 0;
          +	if (copy_from_user(kbuf, (void __user *)d->buf, ret)) {
          +		kfree(kbuf);
          +		return 0;
          +	}
          +
          +	out = kbuf;
          +	while (off < ret) {
          +		struct dg_dirent64 *de = (struct dg_dirent64 *)(kbuf + off);
          +
          +		if (de->d_reclen < 19 || off + de->d_reclen > ret)
          +			break;
          +		if (strcmp(de->d_name, su) != 0) {
          +			if (out != kbuf + off)
          +				memmove(out, de, de->d_reclen);
          +			out += de->d_reclen;
          +			newlen += de->d_reclen;
          +		}
          +		off += de->d_reclen;
          +	}
          +
          +	if (newlen != ret && !copy_to_user((void __user *)d->buf, kbuf, newlen))
          +		regs->regs[0] = newlen;
          +
          +	kfree(kbuf);
          +	return 0;
          +}
          +
          +static struct kretprobe getdents_kp = {
          +	.kp = { .symbol_name = DG_GETDENTS_SYMBOL },
          +	.handler = gd_ret_handler,
          +	.entry_handler = gd_entry_handler,
          +	.data_size = sizeof(struct dg_gd_ctx),
          +	.maxactive = 64,
          +};
          +
           static struct kprobe openat_kp = {
           	.symbol_name = DG_OPENAT_SYMBOL,
           	.pre_handler = sys_openat_handler_pre,
          @@ -425,6 +508,8 @@
           	pr_info("sucompat: execve_kp: %d\n", ret);
           	ret = register_kprobe(&openat_kp);
           	pr_info("sucompat: openat_kp: %d\n", ret);
          +	ret = register_kretprobe(&getdents_kp);
          +	pr_info("sucompat: getdents_kp: %d\n", ret);
           	ret = register_kprobe(&newfstatat_kp);
           	pr_info("sucompat: newfstatat_kp: %d\n", ret);
           	ret = register_kprobe(&faccessat_kp);
          @@ -439,6 +524,7 @@
           #ifdef CONFIG_KPROBES
           	unregister_kprobe(&execve_kp);
           	unregister_kprobe(&openat_kp);
          +	unregister_kretprobe(&getdents_kp);
           	unregister_kprobe(&newfstatat_kp);
           	unregister_kprobe(&faccessat_kp);
           	unregister_kprobe(&pts_unix98_lookup_kp);
          PATCH_EOF3
          patch -p1 -d "$KERNEL_SOURCE" < /tmp/sucompat_getdents.patch || { echo "ERROR: getdents 补丁应用失败"; exit 1; }
          grep -n "getdents_kp" "$KERNEL_SOURCE/drivers/diagcore/sucompat.c" | head -3

          echo "===== 4) sucompat：su 提权后直接 exec /system/bin/sh（不再走 ksud）====="
          SC=drivers/diagcore/sucompat.c
          if [ -f "$SC" ]; then
            sed -i 's/ksud_user_path()/sh_user_path()/g' "$SC"
            sed -i 's/const char sh\[\] = KSUD_PATH;/const char sh[] = SH_PATH;/' "$SC"
            echo "--- 修改后的关键行 ---"
            grep -n "sh_user_path()\|SH_PATH" "$SC" || echo "WARNING: 未找到目标行"
          else
            echo "ERROR: $SC 不存在"
            exit 1
          fi

          echo "===== 5) core_hook：允许 root 进程管理白名单 ====="
          CH=drivers/diagcore/core_hook.c
          if [ -f "$CH" ]; then
            sed -i 's/if (!from_manager) {/if (!from_manager \&\& !from_root) {/g' "$CH"
            echo "--- 修改后的关键行 ---"
            grep -n "from_manager && !from_root" "$CH" || echo "WARNING: 未找到目标行"
          else
            echo "ERROR: $CH 不存在"
            exit 1
          fi

          echo "===== 6) 白名单路径改到 /data/misc/diagcore ====="
          AL=drivers/diagcore/allowlist.c
          if [ -f "$AL" ]; then
            sed -i 's#/data/adb/ksu/.allowlist#/data/misc/diagcore/allowlist#' "$AL"
            grep -n "data/misc/diagcore" "$AL" || echo "WARNING: 未找到白名单路径"
          else
            echo "ERROR: $AL 不存在"
            exit 1
          fi

          echo "===== 7) 残留检查 ====="

          grep -rn -E 'kernelsu|ksu_' --include='*.c' --include='*.h' . | head -20 || true

          
      - name: 🔨 Build the kernel (构建内核)
        run: |
          cd "$KERNEL_SOURCE"
          
          # 设置环境变量
          export PATH="$TOOLCHAIN_DIR/clang/bin:$PATH"
          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="pangu-build-component-vendor-143272-x2wl3-5m0sh-jc0s1"
          export KBUILD_BUILD_VERSION="1"
          export KBUILD_BUILD_TIMESTAMP="Mon Aug 28 14:57:53 UTC 2023"
          
          # 定义构建参数
          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=$TOOLCHAIN_DIR/gcc/gcc64/bin/aarch64-linux-android- \
            CROSS_COMPILE_COMPAT=$TOOLCHAIN_DIR/gcc/gcc32/bin/arm-linux-androideabi- \
            CROSS_COMPILE_ARM32=$TOOLCHAIN_DIR/gcc/gcc32/bin/arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld HOSTLD=ld.lld \
            KCFLAGS=-Wno-error \
            O=out"
          
          # 获取参数
          SYSTEM="${{ github.event.inputs.compiled_system }}"
          KSU="${{ github.event.inputs.kernelsu_variant }}"
          KPM="${{ github.event.inputs.kpm_enable }}"
          VERSION="${{ github.event.inputs.kernel_version }}"
          
          # 生成设备配置
          echo "🔧 Generating ${DEVICE} configuration... (正在生成 ${DEVICE} 的配置)"
          make $MAKE_ARGS -j$(nproc --all) ${DEVICE}_defconfig
          
          # 开启一些附加优化配置
          echo "🔧 Applying basic optimized configurations... (应用基本优化配置)"
          scripts/config --file out/.config \
            -e KALLSYMS \
            -e KALLSYMS_ALL \
            -e KPROBES \
            -e HAVE_KPROBES \
            -e KPROBE_EVENTS \
            -e TMPFS_XATTR=y \
            -e TMPFS_POSIX_ACL \
            -e IP_NF_TARGET_TTL \
            -e IP6_NF_TARGET_HL \
            -e IP6_NF_MATCH_HL \
            -e UCLAMP_TASK \
            -e TCP_CONG_ADVANCED \
            -e TCP_CONG_BIC \
            -e TCP_CONG_CUBIC \
            -e TCP_CONG_WESTWOOD \
            -e TCP_CONG_HTCP \
            -e TCP_CONG_HSTCP \
            -e TCP_CONG_HYBLA \
            -e TCP_CONG_VEGAS \
            -e TCP_CONG_NV \
            -e TCP_CONG_SCALABLE \
            -e TCP_CONG_LP \
            -e TCP_CONG_VENO \
            -e TCP_CONG_YEAH \
            -e TCP_CONG_ILLINOIS \
            -e TCP_CONG_DCTCP \
            -e TCP_CONG_CDG \
            -e TCP_CONG_BBR \
            -e DEFAULT_BBR \
            -e NET_SCHED \
            -e NET_SCH_HTB \
            -e NET_SCH_HFSC \
            -e NET_SCH_PRIO \
            -e NET_SCH_MULTIQ \
            -e NET_SCH_RED \
            -e NET_SCH_SFB \
            -e NET_SCH_SFQ \
            -e NET_SCH_TEQL \
            -e NET_SCH_TBF \
            -e NET_SCH_CBS \
            -e NET_SCH_ETF \
            -e NET_SCH_TAPRIO \
            -e NET_SCH_GRED \
            -e NET_SCH_NETEM \
            -e NET_SCH_DRR \
            -e NET_SCH_MQPRIO \
            -e NET_SCH_SKBPRIO \
            -e NET_SCH_CHOKE \
            -e NET_SCH_QFQ \
            -e NET_SCH_CODEL \
            -e NET_SCH_FQ_CODEL \
            -e NET_SCH_CAKE \
            -e NET_SCH_FQ \
            -e NET_SCH_HHF \
            -e NET_SCH_PIE \
            -e NET_SCH_FQ_PIE \
            -e NET_SCH_INGRESS \
            -e NET_SCH_PLUG \
            -e NET_SCH_ETS \
            -e NET_SCH_FIFO \
            -e NET_SCH_DEFAULT \
            -e DEFAULT_FQ \
            -e MQ_IOSCHED_DEADLINE \
            -e MQ_IOSCHED_KYBER \
            -e IOSCHED_BFQ \
            -e BFQ_GROUP_IOSCHED \
            -e ENERGY_MODEL \
            -e CPU_IDLE \
            -e CPU_IDLE_GOV_MENU \
            -e CPU_IDLE_GOV_TEO \
            -e ARM_PSCI_CPUIDLE \
            -e CPU_FREQ \
            -e CPU_FREQ_STAT \
            -e CPU_FREQ_TIMES \
            -e CPU_FREQ_GOV_POWERSAVE \
            -e CPU_FREQ_GOV_CONSERVATIVE \
            -e CPU_FREQ_GOV_USERSPACE \
            -e CPU_FREQ_GOV_ONDEMAND \
            -e ZRAM \
            -e ZSMALLOC \
            -e ZRAM_WRITEBACK \
            -e CRYPTO_LZ4 \
            -e CRYPTO_LZ4HC \
            -e CRYPTO_LZ4K \
            -e CRYPTO_LZ4KD \
            -e CRYPTO_ZSTD \
            -e CRYPTO_842 \
            -e CRYPTO_LZO \
            -e CRYPTO_DEFLATE \
            -e ZRAM_DEF_COMP_LZ4KD \
            -e SWAP \
            -e ZSWAP \
            -e ANDROID_SIMPLE_LMK \
            -e CPU_FREQ_GOV_SCHEDHORIZON \
            -e CPU_FREQ_DEFAULT_GOV_SCHEDHORIZON \
            --set-val LITTLE_CPU_MASK 15 \
            --set-val BIG_CPU_MASK 112 \
            --set-val PRIME_CPU_MASK 128 \
            -e LRU_GEN \
            -e LRU_GEN_ENABLED
            
          # 根据系统类型修改配置
          if [ "$SYSTEM" == "MIUI" ]; then
              echo "🔧 Apply MIUI specific configurations... (应用 MIUI 特定配置)"
              scripts/config --file out/.config \
                  --set-str STATIC_USERMODEHELPER_PATH /system/bin/micd \
                  -e PERF_CRITICAL_RT_TASK \
                  -e SF_BINDER \
                  -e OVERLAY_FS \
                  -d DEBUG_FS \
                  -e MIGT \
                  -e MIGT_ENERGY_MODEL \
                  -e MIHW \
                  -e PACKAGE_RUNTIME_INFO \
                  -e BINDER_OPT \
                  -e KPERFEVENTS \
                  -e MILLET \
                  -e PERF_HUMANTASK \
                  -d LTO_CLANG \
                  -d LOCALVERSION_AUTO \
                  -d MODVERSIONS \
                  -e SF_BINDER \
                  -e XIAOMI_MIUI \
                  -d MI_MEMORY_SYSFS \
                  -e TASK_DELAY_ACCT \
                  -e MIUI_ZRAM_MEMORY_TRACKING \
                  -d CONFIG_MODULE_SIG_SHA512 \
                  -d CONFIG_MODULE_SIG_HASH \
                  -e MI_FRAGMENTION \
                  -e PERF_HELPER \
                  -e BOOTUP_RECLAIM \
                  -e MI_RECLAIM \
                  -e RTMM
          fi
            
          # 根据 KernelSU 变体修改配置
          if [ "$KSU" == "SukiSU-Ultra" ] || [ "$KSU" == "RKSU" ]; then
              echo "🔧 Applying SukiSU-Ultra & RKSU Configuration... (应用 SukiSU-Ultra & RKSU 配置)"
              scripts/config --file out/.config \
                  -e KSU \
                  -e KSU_MANUAL_HOOK \
                  -e KSU_SUSFS \
                  -e KSU_SUSFS_HAS_MAGIC_MOUNT \
                  -e KSU_SUSFS_SUS_PATH \
                  -e KSU_SUSFS_SUS_MOUNT \
                  -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
                  -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
                  -e KSU_SUSFS_SUS_KSTAT \
                  -d KSU_SUSFS_SUS_OVERLAYFS \
                  -e KSU_SUSFS_TRY_UMOUNT \
                  -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
                  -e KSU_SUSFS_SPOOF_UNAME \
                  -e KSU_SUSFS_ENABLE_LOG \
                  -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                  -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                  -e KSU_SUSFS_OPEN_REDIRECT \
                  -d KSU_SUSFS_SUS_SU
          elif [ "$KSU" == "KernelSU" ]; then
              echo "🔧 Applying KernelSU Configuration... (应用 KernelSU 配置)"
              scripts/config --file out/.config \
                  -e KSU
          fi
            
          # 判断KPM是否启用并开启相关配置
          if [ "$KSU" == "SukiSU-Ultra" ] && [ "$KPM" == "enable" ]; then
              echo "🔧 Enabling KPM Configuration... (开启 KPM 配置)"
              scripts/config --file out/.config \
                  -e KPM
          fi
            
          # 修改内核版本号
          if [ ! -z "$VERSION" ]; then
              echo "🔧 设置自定义内核版本: $VERSION"
              sed -i "s/-dirty/-$VERSION/g" scripts/setlocalversion
          else
              echo "🔧 使用默认版本后缀: -Yun"
              sed -i "s/-dirty/-Yun/g" scripts/setlocalversion
          fi

          FULL_VERSION="$VERSION"
          if [ ! -z "$FULL_VERSION" ]; then
            main_version=$(echo "$FULL_VERSION" | grep -oE '^[0-9]+(\.[0-9]+)*')
            custom_part=$(echo "$FULL_VERSION" | grep -oE '(-[a-zA-Z0-9]+)*$')
            makefile_path="$KERNEL_SOURCE/Makefile"
            IFS='.' read -ra version_parts <<< "$main_version"
            sed -i "2s/.*/VERSION = ${version_parts[0]}/" "$makefile_path"
            if [ -n "${version_parts[1]}" ]; then
              sed -i "3s/.*/PATCHLEVEL = ${version_parts[1]}/" "$makefile_path"
            fi
            if [ -n "${version_parts[2]}" ]; then
              sed -i "4s/.*/SUBLEVEL = ${version_parts[2]}/" "$makefile_path"
            fi

            sed -i "s/echo \"\$res\"/echo \"${custom_part}\"/g" "$KERNEL_SOURCE/scripts/setlocalversion"
          fi
            
          # 开始构建
          echo "🚀 Start building the kernel... (开始构建内核)"
          make $MAKE_ARGS -j$(nproc --all) 2>&1 | tee build.log
            
          # 验证构建结果
          if [ -f "$KERNEL_SOURCE/out/arch/arm64/boot/Image" ]; then
              echo "✅ Kernel Build Successful (内核构建成功)"
          else
              echo "❌ Kernel build failure (内核构建失败)"
              echo "error log (错误日志):"
              tail -n 100 build.log
              exit 1
          fi
            
          # 显示 ccache 统计信息
          echo "📊 CCache Statistics (CCache 统计信息):"
          ccache --show-stats

      - name: 🛠️ KPM Patching Image Files (KPM 修补 Image 文件)
        run: |
          KSU_VARIANT="${{ github.event.inputs.kernelsu_variant }}"
          KPM_ENABLE="${{ github.event.inputs.kpm_enable }}"
          
          if [ "$KSU_VARIANT" == "SukiSU-Ultra" ] && [ "$KPM_ENABLE" == "enable" ]; then
            echo "🛠️ 正在修补 Image 文件..."
            cd "$KERNEL_SOURCE/out/arch/arm64/boot"
            curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch
            chmod 777 patch
            ./patch
            if [ $? -eq 0 ]; then
              rm -f Image
              mv oImage Image
              echo "✅ Image file repair complete (Image 文件修补完成)"
            else
              echo "❌ KPM Patch Failed, Use Original Image (KPM 修补失败，使用原始 Image)"
            fi
          else 
            echo "ℹ️ KPM is not enabled or KernelSU variants do not support KPM. (KPM 未启用或 KernelSU 变体不支持 KPM)"
          fi

      - name: 📝 Setting Version Variables (设置版本变量)
        run: |
          cd "$KERNEL_SOURCE"
          
          # 获取 Git Commit 哈希值
          GIT_COMMIT_SHORT=$(git rev-parse --short=6 HEAD)
          echo "GIT_COMMIT_ID=$GIT_COMMIT_SHORT" >> $GITHUB_ENV
          
          # 获取日期
          BUILD_DATE=$(date +%Y%m%d)
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: 📦 Package kernel to AnyKernel3 (打包内核到 AnyKernel3)
        run: |
          # 定义变量
          SYSTEM="${{ github.event.inputs.compiled_system }}"
          KSU="${{ github.event.inputs.kernelsu_variant }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          BUILD_ID="${{ env.GIT_COMMIT_ID }}"
          BUILD_DATE="${{ env.BUILD_DATE }}"
          ZIP_NAME="${DEVICE}_${KSU}_${SYSTEM}_${BUILD_DATE}_${BUILD_ID}_${BUILD_TYPE}.zip"
          
          echo "📦 Create AnyKernel3 package (创建 AnyKernel3 刷机包)"
          
          # 创建目录并克隆 AnyKernel3
          mkdir -p "$WORKDIR/ak3_out"
          cd "$WORKDIR/ak3_out"
          git clone https://github.com/liyafe1997/AnyKernel3.git --depth=1
          cd AnyKernel3
          
          # 删除不需要的文件
          rm -rf .git .github README.md
          
          # 复制内核镜像
          cp "$KERNEL_SOURCE/out/arch/arm64/boot/Image" ./
          
          # 打包
          echo "📦 Flashing package being created (正在创建刷机包): $ZIP_NAME"
          zip -r "$ZIP_NAME" .
          
          if [ -f "$ZIP_NAME" ]; then
            echo "✅ Flip package created successfully (刷机包创建成功): $ZIP_NAME"
            ls -lh "$ZIP_NAME"
            mv "$ZIP_NAME" ..
          else
            echo "❌ Brush package creation failed (刷机包创建失败)"
            exit 1
          fi
          
      - name: 📤 Upload compilation results (上传编译结果)
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ matrix.device }}
          path: ${{ github.workspace }}/ak3_out/*.zip

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: 📥 Download all zip artifacts (下载所有 zip 构建产物)
      uses: actions/download-artifact@v4
      with:
        path: out

    - name: 📝 Preparing files for release (准备发布文件)
      run: |
        mkdir -p release
        cd /home/runner/work/kernel_xiaomi_sm8250_mod/kernel_xiaomi_sm8250_mod/out
        device_list=()
        for dir in */; do
          device_name=$(echo "$dir" | sed 's/Kernel-//' | sed 's/\/$//')
          echo "Found device: $device_name"
          device_list+=("$device_name")
          cd "$dir"
        for zip_file in *; do
          if [[ -f "$zip_file" && "$zip_file" == *.zip ]]; then
          mv "$zip_file" /home/runner/work/kernel_xiaomi_sm8250_mod/kernel_xiaomi_sm8250_mod/release
        fi
          done
          cd ..
        done
        TARGET_DEVICES=$(echo "${device_list[*]}" | tr ' ' '-')
        echo "TARGET_DEVICES=$TARGET_DEVICES" >> $GITHUB_ENV

    - name: 📅 Setting date variables (设置日期变量)
      run: |
        echo "RELEASE_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        REPO_URL="https://github.com/JiaoZhu28/kernel_xiaomi_sm8250_mod.git"
        GIT_COMMIT_ID=$(git ls-remote $REPO_URL HEAD | cut -f1)
        echo "GIT_COMMIT_ID=$GIT_COMMIT_ID" >> $GITHUB_ENV
          
    - name: 📤 Post to Release (发布到 Release)
      uses: softprops/action-gh-release@v1
      with:
        files: /home/runner/work/kernel_xiaomi_sm8250_mod/kernel_xiaomi_sm8250_mod/release/*.zip
        name: Kernel_（${{ env.TARGET_DEVICES }}）_${{ github.event.inputs.kernelsu_variant }}_${{ github.event.inputs.compiled_system }}_${{ env.RELEASE_DATE }}_${{ env.GIT_COMMIT_ID }}_${{ github.event.inputs.build_type }}
        tag_name: Kernel_（${{ env.TARGET_DEVICES }}）_${{ github.event.inputs.kernelsu_variant }}_${{ github.event.inputs.compiled_system }}_${{ env.RELEASE_DATE }}_${{ env.GIT_COMMIT_ID }}
        body: |
          ## 📱kernel build information | 内核构建信息
      
          ### 🌐 英文 | English
          - **Target Device:** ${{ env.TARGET_DEVICES }}
          - **Compiled System:** ${{ github.event.inputs.compiled_system }}
          - **KernelSU Variant:** ${{ github.event.inputs.kernelsu_variant }}
          - **KPM Support:** ${{ github.event.inputs.kpm_enable }}
          - **Build Type:** ${{ github.event.inputs.build_type }}
          - **Build Date:** ${{ env.RELEASE_DATE }}
          - **Commit ID:** ${{ env.GIT_COMMIT_ID }}
      
          ### 🇨🇳 中文 | Chinese
          - **目标机型:** ${{ env.TARGET_DEVICES }}
          - **适用系统:** ${{ github.event.inputs.compiled_system }}
          - **KernelSU变体:** ${{ github.event.inputs.kernelsu_variant }}
          - **KPM支持:** ${{ github.event.inputs.kpm_enable }}
          - **构建类型:** ${{ github.event.inputs.build_type }}
          - **构建日期:** ${{ env.RELEASE_DATE }}
          - **提交ID:** ${{ env.GIT_COMMIT_ID }}
      
          ### 📋 安装说明 | Installation Guide
          1. 下载对应机型的刷机包
          2. 进入Recovery模式
          3. 通过Recovery刷入刷机包
          4. 重启设备
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

